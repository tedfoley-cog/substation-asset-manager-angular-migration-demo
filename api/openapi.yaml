components:
  schemas:
    AuditEventDto:
      properties:
        action:
          type: string
        actor:
          type: string
        clientIp:
          nullable: true
          type: string
        details:
          nullable: true
          type: string
        entityId:
          nullable: true
          type: string
        entityType:
          type: string
        id:
          format: int64
          type: integer
        occurredAt:
          format: date-time
          type: string
        outcome:
          enum:
          - SUCCESS
          - DENIED
          - FAILURE
          type: string
      required:
      - id
      - occurredAt
      - actor
      - action
      - entityType
      - outcome
      type: object
    BayDto:
      properties:
        bayType:
          enum:
          - TRANSFORMER
          - LINE
          - FEEDER
          - BUSBAR
          type: string
        id:
          format: int64
          type: integer
        iedCount:
          format: int32
          type: integer
        name:
          type: string
        nominalKv:
          type: number
        substationId:
          format: int64
          type: integer
      required:
      - id
      - substationId
      - name
      - bayType
      - nominalKv
      - iedCount
      type: object
    CurrentUserDto:
      properties:
        authenticated:
          type: boolean
        displayName:
          type: string
        locale:
          type: string
        permissions:
          items:
            type: string
          type: array
        role:
          enum:
          - VIEWER
          - ENGINEER
          - PROTECTION_ADMIN
          - AUDITOR
          type: string
        username:
          type: string
      required:
      - username
      - displayName
      - role
      - locale
      - authenticated
      - permissions
      type: object
    DisturbanceRecordDto:
      properties:
        analogChannels:
          format: int32
          type: integer
        digitalChannels:
          format: int32
          type: integer
        downloaded:
          type: boolean
        downloadedAt:
          format: date-time
          nullable: true
          type: string
        downloadedBy:
          nullable: true
          type: string
        durationMs:
          format: int32
          type: integer
        faultType:
          nullable: true
          type: string
        fileFormat:
          type: string
        id:
          format: int64
          type: integer
        iedId:
          format: int64
          type: integer
        iedName:
          type: string
        recordId:
          type: string
        sampleRateHz:
          format: int32
          type: integer
        sizeBytes:
          format: int64
          type: integer
        substationCode:
          type: string
        triggerSource:
          type: string
        triggeredAt:
          format: date-time
          type: string
      required:
      - id
      - recordId
      - iedId
      - iedName
      - substationCode
      - triggeredAt
      - triggerSource
      - durationMs
      - sampleRateHz
      - analogChannels
      - digitalChannels
      - fileFormat
      - sizeBytes
      - downloaded
      type: object
    FirmwareAssignmentRequest:
      properties:
        firmwareVersionId:
          format: int64
          type: integer
      required:
      - firmwareVersionId
      type: object
    FirmwareDto:
      properties:
        approved:
          type: boolean
        endOfLife:
          type: boolean
        id:
          format: int64
          type: integer
        notes:
          nullable: true
          type: string
        platform:
          type: string
        releasedOn:
          format: date
          type: string
        version:
          type: string
      required:
      - id
      - platform
      - version
      - releasedOn
      - approved
      - endOfLife
      type: object
    IedDto:
      properties:
        activeSettingsVersion:
          description: versionNo of the ACTIVE settings file, null when none
          format: int32
          nullable: true
          type: integer
        bayId:
          format: int64
          type: integer
        bayName:
          type: string
        deviceType:
          enum:
          - TRANSFORMER_DIFFERENTIAL
          - LINE_DISTANCE
          - FEEDER_PROTECTION
          - BAY_CONTROLLER
          - MERGING_UNIT
          type: string
        firmware:
          $ref: '#/components/schemas/FirmwareDto'
          nullable: true
        id:
          format: int64
          type: integer
        installedOn:
          format: date
          nullable: true
          type: string
        ipAddress:
          nullable: true
          type: string
        lastSeenAt:
          format: date-time
          nullable: true
          type: string
        lastSettingsUploadAt:
          format: date-time
          nullable: true
          type: string
        model:
          type: string
        name:
          type: string
        platform:
          type: string
        recordCount:
          format: int64
          type: integer
        sclIedName:
          description: IED name from the most recent SCL import that matched this device
          nullable: true
          type: string
        serialNumber:
          type: string
        settingsFileCount:
          format: int64
          type: integer
        status:
          enum:
          - IN_SERVICE
          - COMMISSIONING
          - MAINTENANCE
          - DECOMMISSIONED
          type: string
        substationCode:
          type: string
        substationId:
          format: int64
          type: integer
        substationName:
          type: string
      required:
      - id
      - name
      - deviceType
      - platform
      - model
      - serialNumber
      - status
      - substationId
      - substationCode
      - substationName
      - bayId
      - bayName
      - settingsFileCount
      - recordCount
      type: object
    SclImportDto:
      properties:
        checksumSha256:
          maxLength: 64
          minLength: 64
          nullable: true
          type: string
        fileType:
          enum:
          - ICD
          - CID
          - SCD
          - SSD
          - IID
          type: string
        filename:
          type: string
        id:
          format: int64
          type: integer
        iedCount:
          format: int32
          type: integer
        ieds:
          items:
            $ref: '#/components/schemas/SclImportIedDto'
          nullable: true
          type: array
        importedAt:
          format: date-time
          type: string
        importedBy:
          type: string
        message:
          nullable: true
          type: string
        sclVersion:
          nullable: true
          type: string
        sizeBytes:
          format: int64
          type: integer
        status:
          enum:
          - PENDING
          - COMPLETED
          - FAILED
          type: string
        substationCode:
          nullable: true
          type: string
      required:
      - id
      - filename
      - fileType
      - iedCount
      - status
      - importedBy
      - importedAt
      - sizeBytes
      type: object
    SclImportIedDto:
      properties:
        accessPoint:
          nullable: true
          type: string
        configVersion:
          nullable: true
          type: string
        iedName:
          type: string
        ipAddress:
          nullable: true
          type: string
        lnClasses:
          items:
            type: string
          type: array
        manufacturer:
          nullable: true
          type: string
        matchedIedId:
          format: int64
          nullable: true
          type: integer
        matchedIedName:
          nullable: true
          type: string
        type:
          nullable: true
          type: string
      required:
      - iedName
      - lnClasses
      type: object
    SettingValueDto:
      properties:
        lnClass:
          type: string
        maxValue:
          nullable: true
          type: string
        minValue:
          nullable: true
          type: string
        name:
          type: string
        settingGroup:
          type: string
        unit:
          nullable: true
          type: string
        value:
          nullable: true
          type: string
      required:
      - settingGroup
      - lnClass
      - name
      type: object
    SettingsFileDto:
      properties:
        checksumSha256:
          type: string
        comment:
          nullable: true
          type: string
        filename:
          type: string
        id:
          format: int64
          type: integer
        iedId:
          format: int64
          type: integer
        iedName:
          type: string
        status:
          enum:
          - DRAFT
          - ACTIVE
          - SUPERSEDED
          type: string
        uploadedAt:
          format: date-time
          type: string
        uploadedBy:
          type: string
        valueCount:
          format: int32
          nullable: true
          type: integer
        values:
          items:
            $ref: '#/components/schemas/SettingValueDto'
          nullable: true
          type: array
        versionNo:
          format: int32
          type: integer
      required:
      - id
      - iedId
      - iedName
      - versionNo
      - filename
      - status
      - uploadedBy
      - uploadedAt
      - checksumSha256
      type: object
    SettingsUploadRequest:
      properties:
        comment:
          maxLength: 512
          minLength: 0
          type: string
        draft:
          type: boolean
        values:
          items:
            $ref: '#/components/schemas/Value'
          type: array
      required:
      - values
      type: object
    StatusChangeRequest:
      properties:
        status:
          enum:
          - IN_SERVICE
          - COMMISSIONING
          - MAINTENANCE
          - DECOMMISSIONED
          type: string
      required:
      - status
      type: object
    SubstationDto:
      properties:
        bayCount:
          format: int32
          type: integer
        bays:
          items:
            $ref: '#/components/schemas/BayDto'
          nullable: true
          type: array
        code:
          type: string
        commissionedOn:
          format: date
          nullable: true
          type: string
        id:
          format: int64
          type: integer
        iedCount:
          format: int64
          type: integer
        latitude:
          nullable: true
          type: number
        longitude:
          nullable: true
          type: number
        name:
          type: string
        nominalKv:
          type: number
        operatorNotes:
          nullable: true
          type: string
        region:
          type: string
      required:
      - id
      - code
      - name
      - region
      - nominalKv
      - bayCount
      - iedCount
      type: object
    UserDto:
      properties:
        active:
          type: boolean
        displayName:
          type: string
        id:
          format: int64
          type: integer
        locale:
          type: string
        role:
          enum:
          - VIEWER
          - ENGINEER
          - PROTECTION_ADMIN
          - AUDITOR
          type: string
        username:
          type: string
      required:
      - id
      - username
      - displayName
      - role
      - locale
      - active
      type: object
    Value:
      properties:
        lnClass:
          maxLength: 8
          minLength: 0
          type: string
        maxValue:
          maxLength: 32
          minLength: 0
          type: string
        minValue:
          maxLength: 32
          minLength: 0
          type: string
        name:
          maxLength: 64
          minLength: 0
          type: string
        settingGroup:
          maxLength: 32
          minLength: 0
          type: string
        unit:
          maxLength: 16
          minLength: 0
          type: string
        value:
          maxLength: 64
          minLength: 0
          type: string
      required:
      - lnClass
      - name
      - settingGroup
      type: object
info:
  description: Protection relay / IED inventory, settings-file history and comparison, IEC 61850 SCL import, COMTRADE disturbance-record
    retrieval and the operator audit trail. The committed contract lives in api/openapi.yaml; the contract tests fail when
    this generated document drifts from it.
  license:
    name: Internal
  title: Substation Asset Manager API
  version: 4.11.2
  x-contract-note: Committed API contract. Regenerate with api/tools/regenerate_contract.py; never hand-edit.
openapi: 3.0.1
paths:
  /api/audit:
    get:
      operationId: search_2
      parameters:
      - in: query
        name: actor
        required: false
        schema:
          type: string
      - in: query
        name: action
        required: false
        schema:
          type: string
      - in: query
        name: entityType
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
      - in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/AuditEventDto'
                type: array
          description: OK
      summary: Audit events, newest first (AUDITOR or PROTECTION_ADMIN)
      tags:
      - Audit trail
      x-contract-example:
        minItems: 5
        request: /api/audit?action=SETTINGS_UPLOAD
        user: sdubois
  /api/audit/actions:
    get:
      operationId: actions
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Distinct audit action codes
      tags:
      - Audit trail
      x-contract-example:
        minItems: 10
        request: /api/audit/actions
  /api/firmware:
    get:
      operationId: firmware
      parameters:
      - in: query
        name: platform
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/FirmwareDto'
                type: array
          description: OK
      summary: Firmware catalogue, optionally filtered by platform
      tags:
      - IEDs
      x-contract-example:
        minItems: 10
        request: /api/firmware
  /api/ieds:
    get:
      operationId: search_1
      parameters:
      - in: query
        name: substationId
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: deviceType
        required: false
        schema:
          enum:
          - TRANSFORMER_DIFFERENTIAL
          - LINE_DISTANCE
          - FEEDER_PROTECTION
          - BAY_CONTROLLER
          - MERGING_UNIT
          type: string
      - in: query
        name: status
        required: false
        schema:
          enum:
          - IN_SERVICE
          - COMMISSIONING
          - MAINTENANCE
          - DECOMMISSIONED
          type: string
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/IedDto'
                type: array
          description: OK
      summary: Search IEDs by substation, device type, status or free text (name, serial, model)
      tags:
      - IEDs
      x-contract-example:
        minItems: 4
        request: /api/ieds?deviceType=LINE_DISTANCE&q=21
  /api/ieds/{id}:
    get:
      operationId: get_4
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IedDto'
          description: OK
      summary: IED detail
      tags:
      - IEDs
      x-contract-example:
        request: /api/ieds/1
  /api/ieds/{id}/firmware:
    put:
      operationId: assignFirmware
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareAssignmentRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IedDto'
          description: OK
      summary: Assign a firmware version (PROTECTION_ADMIN only)
      tags:
      - IEDs
  /api/ieds/{id}/status:
    put:
      operationId: changeStatus
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IedDto'
          description: OK
      summary: Change IED lifecycle status
      tags:
      - IEDs
  /api/ieds/{iedId}/settings:
    get:
      operationId: history
      parameters:
      - in: path
        name: iedId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/SettingsFileDto'
                type: array
          description: OK
      summary: Settings-file history of an IED, newest first (no values)
      tags:
      - Settings files
      x-contract-example:
        minItems: 3
        request: /api/ieds/1/settings
    post:
      operationId: upload_1
      parameters:
      - in: path
        name: iedId
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUploadRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SettingsFileDto'
          description: Created
      summary: Upload a new settings-file version (ENGINEER or PROTECTION_ADMIN)
      tags:
      - Settings files
  /api/me:
    get:
      operationId: me
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CurrentUserDto'
          description: OK
      summary: Identity and permissions resolved from the trusted X-SAM-User header
      tags:
      - Users
      x-contract-example:
        request: /api/me
        user: mbrandt
  /api/records:
    get:
      operationId: search
      parameters:
      - in: query
        name: iedId
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: substationId
        required: false
        schema:
          format: int64
          type: integer
      - in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
      - in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
      - in: query
        name: downloaded
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/DisturbanceRecordDto'
                type: array
          description: OK
      summary: Disturbance records available for download, newest first
      tags:
      - Disturbance records
      x-contract-example:
        minItems: 2
        request: /api/records?substationId=1&downloaded=false
  /api/records/{id}:
    get:
      operationId: get_3
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DisturbanceRecordDto'
          description: OK
      summary: Disturbance record detail
      tags:
      - Disturbance records
      x-contract-example:
        request: /api/records/1
  /api/records/{id}/download:
    post:
      operationId: download
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                type: string
          description: OK
      summary: Retrieve the record; returns the COMTRADE .cfg and marks the record downloaded
      tags:
      - Disturbance records
  /api/scl/imports:
    get:
      operationId: list_2
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/SclImportDto'
                type: array
          description: OK
      summary: Import history, newest first
      tags:
      - SCL import
      x-contract-example:
        minItems: 7
        request: /api/scl/imports
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  type: string
              required:
              - file
              type: object
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SclImportDto'
          description: Created
      summary: Upload and parse an IEC 61850 SCL file (.icd/.cid/.scd)
      tags:
      - SCL import
  /api/scl/imports/{id}:
    get:
      operationId: get_2
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SclImportDto'
          description: OK
      summary: Import detail including the IEDs found in the file
      tags:
      - SCL import
      x-contract-example:
        request: /api/scl/imports/1
  /api/settings/{fileId}:
    get:
      operationId: get_1
      parameters:
      - in: path
        name: fileId
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SettingsFileDto'
          description: OK
      summary: Settings file with every setting value
      tags:
      - Settings files
      x-contract-example:
        request: /api/settings/1
  /api/substations:
    get:
      operationId: list_1
      parameters:
      - in: query
        name: region
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/SubstationDto'
                type: array
          description: OK
      summary: List substations, optionally filtered by region
      tags:
      - Substations
      x-contract-example:
        minItems: 2
        request: /api/substations?region=North
  /api/substations/{id}:
    get:
      operationId: get
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubstationDto'
          description: OK
      summary: Substation detail including bays
      tags:
      - Substations
      x-contract-example:
        request: /api/substations/1
  /api/substations/{id}/bays:
    get:
      operationId: bays
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/BayDto'
                type: array
          description: OK
      summary: Bays of a substation
      tags:
      - Substations
      x-contract-example:
        minItems: 4
        request: /api/substations/1/bays
  /api/users:
    get:
      operationId: list
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/UserDto'
                type: array
          description: OK
      summary: Operator accounts and roles
      tags:
      - Users
      x-contract-example:
        minItems: 6
        request: /api/users
servers:
- description: Generated server url
  url: http://localhost
