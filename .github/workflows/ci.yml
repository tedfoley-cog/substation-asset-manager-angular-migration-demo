name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    name: backend · unit + contract + architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -q -B test
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-surefire, path: backend/target/surefire-reports, if-no-files-found: ignore }

  frontend:
    name: frontend · build + lint + karma + ng test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
        env: { CHROME_BIN: /usr/bin/google-chrome }
      - run: npm run test:ng
        working-directory: frontend
        env: { CHROME_BIN: /usr/bin/google-chrome }

  checks:
    name: failure-mode checks (FM-01..03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Resolve diff base
        id: base
        run: |
          if [ -n "${{ github.base_ref }}" ]; then echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.ref_name }}" = "main" ]; then echo "ref=HEAD~1" >> "$GITHUB_OUTPUT";
          else git fetch origin main --depth=200 && echo "ref=origin/main" >> "$GITHUB_OUTPUT"; fi
      - run: python3 tools/checks/run_all.py --base ${{ steps.base.outputs.ref }}
        env: { PR_BODY: "${{ github.event.pull_request.body }}" }

  ui:
    name: ui gauntlet (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Start backend (H2, seeded)
        run: |
          cd backend && (mvn -q -B spring-boot:run > /tmp/backend.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf localhost:8080/api/substations >/dev/null && break; sleep 2; done
          curl -sf localhost:8080/api/substations >/dev/null || { cat /tmp/backend.log; exit 1; }
      - name: Start frontend
        run: |
          cd frontend && npm ci && npm run build && (node server/dev-server.js > /tmp/frontend.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:3000/ >/dev/null && break; sleep 1; done
      - name: Run gauntlet
        run: |
          cd tests/ui && npm ci && npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report
            tests/ui/test-results
            tests/ui/screenshots
          if-no-files-found: ignore
