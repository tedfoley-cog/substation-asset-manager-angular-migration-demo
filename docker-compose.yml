services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sam
      POSTGRES_USER: sam
      POSTGRES_PASSWORD: sam-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam -d sam"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: ./backend
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://repo.maven.apache.org/maven2}
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      # Docker's embedded DNS answers A records only; the JVM's dual-stack lookup of `db` fails without this on some hosts.
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sam
      SPRING_DATASOURCE_USERNAME: sam
      SPRING_DATASOURCE_PASSWORD: sam-local-only
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/substations >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]
